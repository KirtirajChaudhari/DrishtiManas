name: drishti-manas
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0
  
  # PyTorch (CUDA 11.8)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8
  
  # Scientific Computing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
  - scikit-learn>=1.3.0
  
  # Image Processing
  - opencv>=4.8.0
  - pillow>=10.0.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Jupyter
  - jupyter>=1.0.0
  - ipykernel>=6.25.0
  - notebook>=7.0.0
  
  # Development Tools
  - pytest>=7.4.0
  - black>=23.0.0
  - flake8>=6.0.0
  
  # Pip dependencies
  - pip:
    - tensorflow>=2.13.0
    - albumentations>=1.3.0
    - timm>=0.9.0
    - transformers>=4.30.0
    - monai>=1.2.0
    - grad-cam>=1.4.0
    - fastapi>=0.100.0
    - uvicorn>=0.23.0
    - sqlalchemy>=2.0.0
    - asyncpg>=0.28.0
    - psycopg[binary]>=3.1.0
    - alembic>=1.12.0
    - pydantic-settings>=2.0.0
    - streamlit>=1.25.0
    - wandb>=0.15.0
    - captum>=0.6.0
    - shap>=0.42.0
    - pydicom>=2.4.0
    - SimpleITK>=2.3.0
    - scikit-image>=0.21.0
    - plotly>=5.15.0
    - gradio>=3.40.0
    - torchmetrics>=1.0.0
    - pyyaml>=6.0
    - python-dotenv>=1.0.0
